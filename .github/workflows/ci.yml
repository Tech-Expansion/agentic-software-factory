name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds, then runs the tests against a fake runtime: no CLI, token or secret is needed.
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The sandbox the runner uses for checks (ADR 0004). Ubuntu 24.04 blocks the user namespaces bubblewrap needs.
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g @anthropic-ai/sandbox-runtime@0.0.81
      # Builds every eval case with its own reference solution, in the sandbox, so a broken case or hidden test is
      # caught here.
      - run: node dist/cli.js eval --reference --out eval-reference.json
