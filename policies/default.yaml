# Default policy. A product's .factory/policy.yaml can only tighten it, with one exception: sandbox.network_allow
# adds the hosts a product needs. The owner edits that file; agents cannot (it is under .factory/).
max_attempts: 3
# Counted with a token read from the cache as a tenth of one. Reaching it stops the next build, not the review of a
# build that is done; `asf decide <id> retry` starts the count again.
max_tokens_per_item: 3000000
# Times a developer on Claude Code is sent back by the checks before it may finish (a Stop hook). 0 turns it off.
check_rounds_in_session: 3
denied_commands:
  - git push
  - git remote
  - git reset --hard
  - git checkout
  - git switch
  - git rebase
  - git merge
  - rm -rf
  - sudo
  - curl
  - wget
  - npm publish
approval_paths:
  - "**/package.json"
  - "**/requirements*.txt"
  - "**/pyproject.toml"
  - "**/go.mod"
  - "**/Cargo.toml"
  - "**/migrations/**"
  - "**/Dockerfile"
  - ".github/**"
  # What runs with the owner's credentials at deploy time: changed only with the owner's approval.
  - "**/.gitlab-ci.yml"
  - "**/deploy*"
  - "**/deploy/**"
  - "**/infra/**"
  - "**/*.tf"
  - "**/k8s/**"
  - "**/helm/**"
  - "**/docker-compose*"
  - "**/compose.y*ml"
# A change here waits for the owner however it was reviewed: it cannot be undone once it runs. Add globs to keep
# the owner's own approval on anything else (for example "**/package.json").
owner_paths:
  - "**/migrations/**"
# Unattended runs may not change these. Planning them is done with the user, in `asf discover`.
protected_paths:
  - ".factory/**"
  - "AGENTS.md"
  - "product/**"
  - "specs/**"
  - "backlog/**"
# Keys, signing, money, auth: never built without acceptance tests first; the security reviewer checks them when it is on.
sensitive_paths: []
# Test files. Deleting one, or adding a skip to one, sends the item back to the developer.
test_paths:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/*_test.go"
# Extra regular expressions for secrets. Added lines that match one never get committed.
secret_patterns: []
# Agent commands and checks run in a sandbox (Claude Code's own for agents, srt for checks). It fails closed.
sandbox:
  # The only hosts sandboxed commands can reach. Registries need no credentials to read.
  network_allow:
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
    - proxy.golang.org
  # Never readable by agents or checks.
  deny_read:
    - "~/.ssh"
    - "~/.claude"
    - "~/.codex"
    - "~/.config"
    - "~/.aws"
    - "~/.azure"
    - "~/.kube"
    - "~/.docker"
    - "~/.gnupg"
    - "~/.netrc"
    - "~/.npmrc"
    - "~/.agentic-software-factory"
  # Writable besides the worktree and the temp directory: package caches.
  write_allow:
    - "~/.npm"
    - "~/.cache"
  # Removed from the environment of agent commands and checks. Names that look like secrets are removed too.
  secret_env:
    - CLAUDE_CODE_OAUTH_TOKEN
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - CODEX_API_KEY
    - GITHUB_TOKEN
    - GH_TOKEN
    - NPM_TOKEN
    - JIRA_API_TOKEN
    - ATLASSIAN_API_TOKEN
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_SESSION_TOKEN
  # Listening and connecting on loopback. On Linux the sandbox has its own loopback; on macOS this opens every local
  # port of the host, so a product turns it on only when its tests need it.
  local_binding: false
