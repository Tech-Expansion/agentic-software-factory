# Settings of this product for the agentic software factory.
# Validated against schemas/project.schema.json. Agents cannot change this file in unattended runs.
factory_version: "{{factory_version}}"
name: "{{name}}"

# explore: find out whether the idea is worth building. validate: prove it with real users. grow: build it properly.
stage: explore

# Settled in `asf discover`.
hypothesis: ""
success_metric: ""
kill_criteria: ""

base_branch: main

runtimes:
  default: claude-code
  # A second vendor for QA catches what the developer's model is blind to:
  # roles:
  #   qa: codex

# Model per role, passed to the CLI as is. Unset roles use the CLI's default. Roles: product-owner, tech-lead,
# developer, qa, security-reviewer, ux-designer, devops, scrum-master.
# models:
#   developer: sonnet

# The workflow items run unless they name their own (`workflow:` on the item, or the ticket label asf-<name>).
# .factory/workflows/<name>.yaml replaces the factory's workflow of that name.
# workflow: feature

# Named path lists that bring in a specialist. ui turns on the UX designer's review for changes under it.
# paths:
#   ui: ["src/ui/**"]

# Commands per environment for `asf deploy <env>`. Only you run them, with your own credentials; agents never do.
# deploy:
#   staging: ["./deploy.sh staging"]

commands:
  # Run once in each new worktree, for example: npm ci
  setup: []
  # Lint, build and test. Run before any model review: the cheapest gate there is.
  check: []

opt_ins:
  backlog: markdown
  docs: markdown
  notifications: desktop
