# Build one backlog item. Acceptance tests are written first, from the criteria, by an agent that does not build;
# they are committed and locked. A failing step after that sends the item back to `build` with the failure as
# feedback, up to the policy's max_attempts. Cheap checks run before the model review. The security reviewer and the
# UX designer come in only when the change calls for them (`when`); `paths.ui` in project.yaml turns the UX review on.
name: feature
steps:
  - id: tests
    kind: agent
    role: qa
    skills: [write-acceptance-tests]
    access: write
    scope: tests
  - id: build
    kind: agent
    role: developer
    skills: [implement-backlog-item]
    access: write
  - id: check
    kind: checks
  - id: verify
    kind: agent
    role: qa
    skills: [verify-against-criteria]
    access: read
    output: verdict
  - id: security
    kind: agent
    role: security-reviewer
    skills: [review-security]
    access: read
    output: verdict
    when: { touches: [sensitive, approval], risk: high }
  - id: ux
    kind: agent
    role: ux-designer
    skills: [review-ux]
    access: read
    output: verdict
    when: { touches: [ui] }
