# Build one backlog item. A failing step sends the item back to `build` with the failure as feedback,
# up to the policy's max_attempts. Cheap checks run before the model review.
name: feature
steps:
  - id: build
    kind: agent
    role: builder
    skills: [implement-backlog-item]
    access: write
  - id: check
    kind: checks
  - id: verify
    kind: agent
    role: verifier
    skills: [verify-against-criteria]
    access: read
    output: verdict
